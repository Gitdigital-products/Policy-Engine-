[project]
name = "gitdigital-policy-engine"
version = "1.0.0"
description = "Rules-as-Code engine for eligibility, compliance logic, and thresholds"
authors = [{name = "GitDigital Team", email = "team@gitdigital.ai"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/gitdigital/policy-engine"
Documentation = "https://gitdigital.github.io/policy-engine"
Repository = "https://github.com/gitdigital/policy-engine"

[tool.poetry.dependencies]
python = "^3.8"
pydantic = "^2.0.0"
pyyaml = "^6.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
redis = "^5.0.0"
celery = "^5.3.0"
jsonschema = "^4.20.0"
jinja2 = "^3.1.0"
graphviz = "^0.20.0"
python-multipart = "^0.0.6"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

version: '3.8'

services:
  policy-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - CACHE_ENABLED=true
    volumes:
      - ./policies:/app/policies
      - ./data:/app/data
    depends_on:
      - redis
      - celery-worker
    command: uvicorn gitdigital.api.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    command: celery -A gitdigital.tasks.celery_app worker --loglevel=info
    depends_on:
      - redis

  celery-beat:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    command: celery -A gitdigital.tasks.celery_app beat --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=policyengine
      - POSTGRES_USER=engine
      - POSTGRES_PASSWORD=enginepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
